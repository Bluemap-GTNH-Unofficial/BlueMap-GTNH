# Workspace pipeline: `mise tasks` lists every task, `mise run <task>` runs it with what it needs first.
#
#   mise run all      everything: builds, unit suites, scenes, verify, exports, oracle, e2e, demo, site
#   mise run plan     what `mise run all` (or `mise run plan <task>...`) would run, without running or recording it
#   mise run check    only the unit suites and scene checks the current changes need (pipeline/affected.toml)
#   mise run adopt    once per workspace: record the outputs already here as current (see pipeline/steps.py)
#
# A task with `sources` and `outputs` is skipped while both hash the same as after its last successful run (content
# hashes, not modification times, so a fresh checkout or a touched file does not rerun anything). The task groups live
# in pipeline/tasks/*.toml: mise counts the file that defines a task as one of its sources, so editing one group does
# not make every other task stale. Development docs: site/development/building.md.
min_version = "2026.10.4"

[settings]
task.source_freshness_hash_contents = true
# One task at a time: exports and oracle captures start a GTNH client, scenes a GTNH server on fixed ports, and only
# one of each may run on this machine.
jobs = 1

[env]
BMGTNH_WORKSPACE = "{{config_root}}"
BMGTNH_PACK_VERSION = "2.9.0"

[task_config]
includes = ["pipeline/tasks/*.toml"]

[tasks.doctor]
description = "Quick checks, run every time: tools, workspace inputs, Gradle cache settings, repository state"
run = "python3 pipeline/steps.py doctor"

[tasks.plan]
description = "The tasks `mise run all` (or `mise run plan TASK...`) would run, on a copy of mise's state; never use `mise run -n` itself here (mise 2026.10.21 records a dry run as a successful run in content-hash mode)"
run = "python3 pipeline/steps.py plan"
raw = true

[tasks.check]
description = "Changed-path checks: unit suites, BlueMap-side world oracle and e2e views of the affected scenes (--plan: print only)"
run = "python3 pipeline/check.py"
raw = true

[tasks.all]
description = "The whole pipeline; on an unchanged tree everything but `doctor` is skipped"
depends = ["doctor", "build", "test", "scenes", "verify", "export", "oracle", "e2e", "demo", "site"]

[tasks.adopt]
description = "Record the existing outputs of the expensive tasks (exports, scenes, oracle, e2e, demo) as current without producing them again; builds, tests, verify and site run normally"
run = "BMGTNH_ADOPT=1 mise run --continue-on-error all"
raw = true
