["oracle:states-default"]
description = "Per-state oracle, variant default: every exported block state -> out/oracle-2.9.0/default/states/ (judged failures are results, not errors)"
wait_for = ["export:default"]
run = "python3 pipeline/steps.py adopt out/oracle-2.9.0/default/states/report.json -- python3 pipeline/steps.py report out/oracle-2.9.0/default/states/report.json -- uv run --directory e2e e2e oracle states --variant default"
sources = [
  "BlueMap/oracle/src/main/**", "BlueMap/oracle/build.gradle.kts",
  "BlueMap/gtnh-render/src/main/**", "BlueMap/legacy/src/main/**", "BlueMap/core/src/main/**",
  "e2e/src/**", "!e2e/**/__pycache__/**", "e2e/scenes/*.yaml", "e2e/oracle/**", "e2e/pyproject.toml", "e2e/uv.lock",
  "gtnh-exporter/launcher/src/gtnh_client/states.py",
  "clients/gtnh-2.9.0/.minecraft/mods/**", "!clients/gtnh-2.9.0/.minecraft/mods/bluemap-gtnh-exporter*.jar",
  "out/exporter-2.9.0/bluemap-gtnh-resources-2.9.0.zip",
]
outputs = ["out/oracle-2.9.0/default/states/report.json"]

