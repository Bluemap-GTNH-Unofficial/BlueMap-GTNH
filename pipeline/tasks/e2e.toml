# Browser regression views (e2e run) and the site. Exports and scenes are ordered with wait_for, as in oracle.toml.

["e2e"]
description = "e2e regression: render every scene that has local baselines (baselines-2.9.0/<scene>/) and compare its views -> out/e2e-2.9.0/<scene>/report.json"
depends = ["build-fork"]
wait_for = ["export:default", "export:addons", "scenes"]
run = '''
python3 pipeline/steps.py adopt 'out/e2e-2.9.0/*/report.json' -- \
  uv run --directory e2e e2e run --no-build $(ls baselines-2.9.0)
'''
sources = [
  "BlueMap/implementations/cli/build/libs/cli-*-shadow.jar", "BlueMap/legacy/build/libs/legacy-*-addon.jar",
  "BlueMap/gtnh-render/build/libs/gtnh-render-*-addon.jar",
  "e2e/src/e2e/*.py", "e2e/scenes/*.yaml", "e2e/pyproject.toml", "e2e/uv.lock",
  "baselines-2.9.0/**",
  "out/exporter-2.9.0/bluemap-gtnh-resources-2.9.0.zip", "out/exporter-addons-2.9.0/bluemap-gtnh-resources-2.9.0-addons.zip",
  "worlds-2.9.0/*/level.dat", "worlds-2.9.0/**/*.mca",
]
outputs = ["out/e2e-2.9.0/*/report.json"]

["site:deps"]
description = "pnpm install of the site (site/node_modules)"
run = "cd site && pnpm install --frozen-lockfile"
sources = ["site/package.json", "site/pnpm-lock.yaml", "site/pnpm-workspace.yaml"]
outputs = ["site/node_modules/.modules.yaml"]

["demo"]
description = "Site demo: maps of the end-game plaza and gt-multiblocks -> site/public/demo/, gallery screenshots -> site/public/generated/"
depends = ["build-fork", "site:deps"]
wait_for = ["export:default", "export:modernity", "export:modernity-vanilla", "scene:endgame", "scene:gt-multiblocks"]
run = "python3 pipeline/steps.py adopt site/public/demo/settings.json site/public/generated/gallery.json -- sh -c 'cd site && pnpm demo'"
sources = [
  "BlueMap/implementations/cli/build/libs/cli-*-shadow.jar", "BlueMap/legacy/build/libs/legacy-*-addon.jar",
  "BlueMap/gtnh-render/build/libs/gtnh-render-*-addon.jar",
  "site/scripts/build-demo.ts",
  "out/exporter-2.9.0/bluemap-gtnh-resources-2.9.0.zip",
  "out/modernity/modernity-*-modded-2.9.0.zip", "out/modernity/modernity-*-vanilla-1.13.zip",
  "out/scenes-2.9.0/endgame/dump.ndjson", "worlds-2.9.0/endgame/level.dat", "worlds-2.9.0/endgame/**/*.mca",
  "out/scenes-2.9.0/gt-multiblocks/dump.ndjson", "worlds-2.9.0/gt-multiblocks/level.dat", "worlds-2.9.0/gt-multiblocks/**/*.mca",
]
outputs = ["site/public/demo/settings.json", "site/public/generated/gallery.json"]

["site"]
description = "Documentation site: vitepress build -> site/.vitepress/dist/, then the Playwright smoke check (pnpm check)"
depends = ["site:deps"]
wait_for = ["demo"]
run = "cd site && pnpm build && pnpm check"
sources = [
  "site/*.md", "site/guide/**", "site/development/**", "site/zh/**",
  "site/.vitepress/config.mts", "site/.vitepress/theme/**", "site/scripts/check-site.ts",
  "site/public/logo.svg", "site/public/demo/settings.json", "site/public/generated/gallery.json",
]
outputs = ["site/.vitepress/dist/index.html"]
