# Resource pack exports. Each one starts a GTNH client, and one set of clients runs at a time (on the Windows host when
# BMGTNH_CLIENT_HOST forwards the launcher's client commands to `gtnh-client serve` there, as the dev container does):
# the launcher holds WS/locks/client.lock where the clients run, and within a run the client tasks are chained with
# `wait_for` in this order: export:default, export:addons, export:modernity, oracle:default, oracle:modernity,
# oracle:addons, oracle:states-default, oracle:states-modernity. Sources: the exporter's code without its oracle capture
# package (which never affects a pack), the launcher, the client's mod jars (minus a leftover exporter jar) and the scene
# dumps whose states are added to the export. The exporter jar comes from build-exporter, passed with --mod-jar so
# the launcher does not run Gradle again. Timeouts are generous upper bounds, not yet 3x a measured container run.

["export:default"]
description = "Default pack -> out/exporter-2.9.0/bluemap-gtnh-resources-2.9.0.zip (client clients/gtnh-2.9.0, extra states of the gtnh-zoo dump)"
wait_for = ["scene:gtnh-zoo"]
timeout = "90m"
run = [
  { task = "build-exporter" },
  '''
  python3 pipeline/steps.py adopt out/exporter-2.9.0/bluemap-gtnh-resources-2.9.0.zip -- \
    uv run --directory gtnh-exporter/launcher gtnh-client export \
      --mod-jar "$(python3 pipeline/steps.py jar gtnh-exporter/build/libs bluemap-gtnh-exporter)" \
      --extra-states-dump "$BMGTNH_WORKSPACE/out/scenes-2.9.0/gtnh-zoo/dump.ndjson"
  ''',
]
sources = [
  "gtnh-exporter/src/main/**", "!gtnh-exporter/src/main/kotlin/de/bluecolored/bluemap/gtnh/exporter/oracle/**",
  "gtnh-exporter/*.gradle*", "gtnh-exporter/gradle.properties",
  "BlueMap/legacy/src/main/kotlin/de/bluecolored/bluemap/gtnh/legacy/ResourceKeys.kt",
  "gtnh-exporter/launcher/src/**", "!gtnh-exporter/launcher/src/gtnh_client/{cameras,states,coverage,screens}.py",
  "!gtnh-exporter/launcher/src/**/__pycache__/**", "gtnh-exporter/launcher/pyproject.toml",
  "clients/gtnh-2.9.0/.minecraft/mods/**", "!clients/gtnh-2.9.0/.minecraft/mods/bluemap-gtnh-exporter*.jar",
  "out/scenes-2.9.0/gtnh-zoo/dump.ndjson",
]
outputs = ["out/exporter-2.9.0/bluemap-gtnh-resources-2.9.0.zip", "out/exporter-2.9.0/export-report.json"]

["export:addons"]
description = "Addon pack -> out/exporter-addons-2.9.0/bluemap-gtnh-resources-2.9.0-addons.zip (client clients/gtnh-addons-2.9.0 + the addon jars of downloads/addons/versions.json)"
wait_for = ["scene:gtnh-zoo", "scene:addons-zoo", "export:default"]
timeout = "90m"
run = [
  { task = "build-exporter" },
  '''
  python3 pipeline/steps.py adopt out/exporter-addons-2.9.0/bluemap-gtnh-resources-2.9.0-addons.zip -- \
    uv run --directory gtnh-exporter/launcher gtnh-client export \
      --mod-jar "$(python3 pipeline/steps.py jar gtnh-exporter/build/libs bluemap-gtnh-exporter)" \
      --client-dir "$BMGTNH_WORKSPACE/clients/gtnh-addons-2.9.0" \
      --out "$BMGTNH_WORKSPACE/out/exporter-addons-2.9.0" --pack-suffix addons \
      $(python3 pipeline/steps.py addon-mods 2.9.0) \
      --extra-states-dump "$BMGTNH_WORKSPACE/out/scenes-2.9.0/gtnh-zoo/dump.ndjson" \
      --extra-states-dump "$BMGTNH_WORKSPACE/out/scenes-2.9.0/addons-zoo/dump.ndjson"
  ''',
]
sources = [
  "gtnh-exporter/src/main/**", "!gtnh-exporter/src/main/kotlin/de/bluecolored/bluemap/gtnh/exporter/oracle/**",
  "gtnh-exporter/*.gradle*", "gtnh-exporter/gradle.properties",
  "BlueMap/legacy/src/main/kotlin/de/bluecolored/bluemap/gtnh/legacy/ResourceKeys.kt",
  "gtnh-exporter/launcher/src/**", "!gtnh-exporter/launcher/src/gtnh_client/{cameras,states,coverage,screens}.py",
  "!gtnh-exporter/launcher/src/**/__pycache__/**", "gtnh-exporter/launcher/pyproject.toml",
  "clients/gtnh-addons-2.9.0/.minecraft/mods/**", "!clients/gtnh-addons-2.9.0/.minecraft/mods/bluemap-gtnh-exporter*.jar",
  "downloads/addons/versions.json", "downloads/addons/*.jar",
  "out/scenes-2.9.0/gtnh-zoo/dump.ndjson", "out/scenes-2.9.0/addons-zoo/dump.ndjson",
]
outputs = ["out/exporter-addons-2.9.0/bluemap-gtnh-resources-2.9.0-addons.zip", "out/exporter-addons-2.9.0/export-report.json"]

["export:modernity-vanilla"]
description = "Modernity-GTNH vanilla textures converted to 1.13 names -> out/modernity/modernity-<release>-vanilla-1.13.zip (no client)"
run = "python3 pipeline/steps.py adopt 'out/modernity/modernity-*-vanilla-1.13.zip' -- uv run --directory modernity modernity vanilla"
timeout = "10m"
sources = [
  "modernity/src/**", "!modernity/src/**/__pycache__/**", "modernity/data/**", "modernity/pyproject.toml",
  "downloads/modernity/release.json", "downloads/modernity/Modernity-*.zip",
]
outputs = ["out/modernity/modernity-*-vanilla-1.13.zip"]

["export:modernity"]
description = "Modernity-GTNH modded pack -> out/modernity/modernity-<release>-modded-2.9.0.zip (default client with the Modernity zip and MyCTMLib for the run)"
wait_for = ["scene:gtnh-zoo", "export:default", "export:addons"]
timeout = "90m"
run = [
  { task = "build-exporter" },
  '''
  python3 pipeline/steps.py adopt 'out/modernity/modernity-*-modded-2.9.0.zip' -- \
    uv run --directory modernity modernity modded \
      --mod-jar "$(python3 pipeline/steps.py jar gtnh-exporter/build/libs bluemap-gtnh-exporter)" \
      --extra-states-dump "$BMGTNH_WORKSPACE/out/scenes-2.9.0/gtnh-zoo/dump.ndjson"
  ''',
]
sources = [
  "gtnh-exporter/src/main/**", "!gtnh-exporter/src/main/kotlin/de/bluecolored/bluemap/gtnh/exporter/oracle/**",
  "gtnh-exporter/*.gradle*", "gtnh-exporter/gradle.properties",
  "BlueMap/legacy/src/main/kotlin/de/bluecolored/bluemap/gtnh/legacy/ResourceKeys.kt",
  "gtnh-exporter/launcher/src/**", "!gtnh-exporter/launcher/src/gtnh_client/{cameras,states,coverage,screens}.py",
  "!gtnh-exporter/launcher/src/**/__pycache__/**", "gtnh-exporter/launcher/pyproject.toml",
  "clients/gtnh-2.9.0/.minecraft/mods/**", "!clients/gtnh-2.9.0/.minecraft/mods/bluemap-gtnh-exporter*.jar",
  "modernity/src/**", "!modernity/src/**/__pycache__/**", "modernity/pyproject.toml",
  "downloads/modernity/release.json", "downloads/modernity/Modernity-*.zip", "downloads/modernity/MyCTMLib-*.jar",
  "out/scenes-2.9.0/gtnh-zoo/dump.ndjson",
]
outputs = ["out/modernity/modernity-*-modded-2.9.0.zip"]

["export"]
description = "Every resource pack: default, addons, Modernity vanilla and modded"
depends = ["export:default", "export:addons", "export:modernity-vanilla", "export:modernity"]
