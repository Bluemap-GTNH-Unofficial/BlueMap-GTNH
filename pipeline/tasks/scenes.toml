["scenes"]
description = "Every scene world (reference server scenes, then the addon server scenes)"
depends = ["scene:vanilla-zoo", "scene:gtnh-zoo", "scene:gt-machines", "scene:gt-pipes", "scene:gt-ores", "scene:gt-multiblocks", "scene:terrain-rwg", "scene:mod-renderers", "scene:endgame", "scene:addons-zoo", "scene:addons-machines", "scene:addons-multiblocks"]

["verify"]
description = "Reader reconciliation: :legacy:verifyDump of every scene snapshot against its dump (result into scene.json); fails on any mismatch"
wait_for = ["scenes", "scene:vanilla-zoo", "scene:gtnh-zoo", "scene:gt-machines", "scene:gt-pipes", "scene:gt-ores", "scene:gt-multiblocks", "scene:terrain-rwg", "scene:mod-renderers", "scene:endgame", "scene:addons-zoo", "scene:addons-machines", "scene:addons-multiblocks"]
run = "for s in vanilla-zoo gtnh-zoo gt-machines gt-pipes gt-ores gt-multiblocks terrain-rwg mod-renderers endgame addons-zoo addons-machines addons-multiblocks; do uv run --directory orchestrator orch verify $s || exit 1; done"
sources = [
  "BlueMap/core/src/main/**", "BlueMap/legacy/src/main/**", "BlueMap/legacy/build.gradle.kts",
  "orchestrator/src/orchestrator/cli.py",
  "out/scenes-2.9.0/*/dump.ndjson", "worlds-2.9.0/*/level.dat", "worlds-2.9.0/**/*.mca",
]
