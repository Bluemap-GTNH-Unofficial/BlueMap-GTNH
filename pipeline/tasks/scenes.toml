# Scene worlds, built by the orchestrator on a headless GTNH server with the bmh harness (one server at a time; the
# workspace runs tasks with jobs = 1). Outputs: the dump and the snapshot's level.dat (not scene.json, which `verify`
# rewrites). Sources: the orchestrator modules the scene uses, the server's mod jars (with the installed bmh jar) and
# the harness sources (a scene runs build-harness first, which installs a changed bmh jar).

["scene:vanilla-zoo"]
description = "Scene vanilla-zoo: every vanilla block variant on a grid -> out/scenes-2.9.0/vanilla-zoo/, worlds-2.9.0/vanilla-zoo/ (server gtnh-2.9.0)"
wait_for = ["build-harness"]
run = [
  { task = "build-harness" },
  "python3 pipeline/steps.py adopt out/scenes-2.9.0/vanilla-zoo/dump.ndjson worlds-2.9.0/vanilla-zoo/level.dat -- uv run --directory orchestrator orch scene vanilla-zoo",
]
sources = [
  "orchestrator/src/orchestrator/cli.py", "orchestrator/src/orchestrator/server.py", "orchestrator/src/orchestrator/rcon.py", "orchestrator/src/orchestrator/volumes.py", "orchestrator/src/orchestrator/packs.py", "orchestrator/src/orchestrator/scenes.py", "orchestrator/src/orchestrator/__init__.py",
  "orchestrator/pyproject.toml",
  "harness/src/main/**", "harness/*.gradle*", "harness/gradle.properties",
  "servers/gtnh-2.9.0/mods/**",
]
outputs = ["out/scenes-2.9.0/vanilla-zoo/dump.ndjson", "worlds-2.9.0/vanilla-zoo/level.dat"]

